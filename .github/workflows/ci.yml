name: CI

# Runs on every push and every pull request targeting main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A new push to the same branch/PR cancels the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one broken target shouldn't hide the others
      matrix:
        env: [ teensyWhite, teensyBlue, teensyOrange ]
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python (required by PlatformIO)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/firmware.hex

  static-analysis:
    name: Static analysis (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [ teensyWhite, teensyBlue, teensyOrange ]
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      # pio check runs cppcheck under the hood, but with the env's real
      # include paths and source filter, so it analyzes only that firmware's files.
      - name: Run static analysis
        run: pio check -e ${{ matrix.env }} --fail-on-defect=high --skip-packages